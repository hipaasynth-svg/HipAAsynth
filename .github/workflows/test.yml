name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Check zero external dependencies
        run: |
          python -c "
          import ast, os, sys
          # Optional-extra imports are allowed ONLY in the specific files that
          # lazily import them behind a [project.optional-dependencies] extra —
          # NOT by bare module name anywhere in the tree. Adding e.g. 'import
          # pyarrow' to any other core module must fail this check. Paths are
          # posix-normalized relative to the repo root.
          EXEMPT = {
              'hipaasynth/exporters/exporters.py': {'pyarrow', 'fhir'},
              'hipaasynth/connectors/duckdb.py': {'duckdb'},
          }
          ALWAYS_OK = {'__future__'}
          external = []
          stdlib = set(sys.stdlib_module_names)
          def is_external(m):
              return bool(m) and m not in stdlib and not m.startswith('hipaasynth') and m not in ALWAYS_OK
          for root, dirs, files in os.walk('hipaasynth'):
              dirs[:] = [d for d in dirs if d not in ['__pycache__']]
              for f in files:
                  if not f.endswith('.py'): continue
                  path = os.path.join(root, f)
                  rel = os.path.relpath(path).replace(os.sep, '/')
                  exempt_here = EXEMPT.get(rel, set())
                  try:
                      with open(path, encoding='utf-8') as fh:
                          tree = ast.parse(fh.read())
                  except Exception:
                      continue
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom):
                          if node.level and node.level > 0:
                              continue
                          mods = [node.module.split('.')[0]] if node.module else []
                      elif isinstance(node, ast.Import):
                          mods = [a.name.split('.')[0] for a in node.names]
                      else:
                          continue
                      for m in mods:
                          if is_external(m) and m not in exempt_here:
                              external.append((rel, m))
          if external:
              print('EXTERNAL DEPS FOUND (outside their allowed file):')
              for path, mod in external: print(f'  {path}: {mod}')
              exit(1)
          print('Zero external dependencies: PASS')
          "

  capabilities:
    # The `test` job above installs only `.[dev]`, which is deliberate: it proves
    # the engine core needs no third-party packages. The cost is that every test
    # gated on an optional dependency SKIPS there, so CI could never regression-
    # detect the capabilities those tests exist to prove — DuckDB loads, Parquet
    # export, and the headless-browser drive of the web UI (issue #87).
    #
    # This job is the other half: install everything, run the same suite, and fail
    # if anything skips. It does not replace the stdlib-only job — it complements it.
    name: capabilities (all optional deps)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with every optional capability
        run: pip install -e ".[test-full]"

      - name: Install Chromium for the browser tests
        # Only the driver comes from pip; this fetches the actual browser binary.
        run: python -m playwright install --with-deps chromium

      - name: Run the full suite
        run: python -m pytest -v -rs --junitxml=capabilities.xml

      - name: Fail if any test skipped
        # A skip here is the exact failure mode this job exists to prevent: a
        # capability test that silently does not run and therefore guards nothing.
        run: |
          python -c "
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('capabilities.xml').getroot()
          suites = root.findall('testsuite') or [root]
          skipped = []
          for suite in suites:
              for case in suite.iter('testcase'):
                  mark = case.find('skipped')
                  if mark is not None:
                      skipped.append((
                          case.get('classname', ''),
                          case.get('name', ''),
                          mark.get('message', ''),
                      ))
          if skipped:
              print(f'{len(skipped)} test(s) SKIPPED in the capabilities job:')
              for cls, name, msg in skipped:
                  print(f'  - {cls}::{name}')
                  print(f'      {msg}')
              print()
              print('This job installs .[test-full] so that nothing skips. A skip here')
              print('means CI is not exercising that capability (issue #87).')
              print('Fix: add the missing dependency to the [test-full] extra in')
              print('pyproject.toml. If the skip is genuinely unavoidable (a real')
              print('platform constraint), document why and allowlist it in this step.')
              sys.exit(1)
          print('No skips: every optional-capability test actually ran.')
          "
