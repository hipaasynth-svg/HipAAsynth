[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hipaasynth"
version = "1.4.0"
description = "Synthetic health data fairness testing for invisible populations"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "HipAAsynth Contributors"},
]
keywords = [
    "synthetic data",
    "health ai",
    "fairness",
    "bias testing",
    "invisible populations",
    "fhir",
    "clinical ai",
    "fairness passport",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
hipaasynth = "hipaasynth.run.main:main"

[project.optional-dependencies]
fhir = ["fhir.resources>=7.0"]
# Optional Parquet export (hipaasynth.exporters.export_parquet). The engine core
# stays pure-Python/standard-library; pyarrow is pulled in only for this feature.
parquet = ["pyarrow>=14.0"]
# Optional DuckDB warehouse connector (hipaasynth.connectors.duckdb). Embedded,
# no server; duckdb is lazily imported only when the connector is used, same
# pattern as pyarrow above.
duckdb = ["duckdb>=0.10"]
seismometer = [
    "seismometer>=0.5",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    # seismometer needs a modern notebook stack that Google Colab does not ship:
    #   - ipython>=8.14 (Colab pins 7.34.0)
    #   - ipywidgets>=8.1 for `Stack` (seismometer only declares >=8.0)
    # Pin the working floors here so a local install renders correctly.
    "ipython>=8.14",
    "ipywidgets>=8.1.2",
    "jupyter",
    "nbconvert",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
]
# Headless-browser tests (tests/test_web_ui.py). Playwright was previously not
# declared in any extra, so the browser-driven proof that the non-Python user
# journey works could not run for anyone but its original author (issue #87).
# NOTE: pip installs only the driver — the browser binary itself still needs a
# one-time `python -m playwright install chromium`.
test-browser = ["playwright>=1.44"]
# Third-party deps of the scripts under examples/, which live outside the
# stdlib-only hipaasynth package and are covered by their own tests:
#   * examples/nooa_validation_orchestrator.py       → pydantic
#   * examples/seismometer/seismometer_adapter.py    → pandas, pyarrow, pyyaml
# The adapter needs no notebook stack to build a package, so this is a deliberate
# subset of [seismometer] — that extra stays the heavier "render the report" one.
examples = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]
# Everything needed to run the suite with ZERO skips. Every skip in the suite is
# dependency-gated, so this is the single "run absolutely everything" install and
# it is what CI's `capabilities` job uses. Keep it exhaustive: a test that skips
# under this extra is a test CI cannot regression-detect.
test-full = ["hipaasynth[dev,parquet,duckdb,test-browser,examples]"]

[project.urls]
Homepage = "https://hipaasynth.com"
Repository = "https://github.com/hipaasynth-svg/hipaasynth"
Issues = "https://github.com/hipaasynth-svg/hipaasynth/issues"

[tool.hatch.build.targets.wheel]
packages = ["hipaasynth"]

[tool.hatch.build.targets.sdist]
include = [
    "/hipaasynth",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["hipaasynth"]
branch = true
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Coverage floor — a ratchet, not a target. Current baseline is ~25% (core
# audit path is well covered; many single-condition generator modules are not
# yet exercised). Raise this as the suite grows; never lower it.
fail_under = 20

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
